services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: notebooklm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=NotebookLM Lite API
      - ENVIRONMENT=production
      - DEBUG=false
      - SECRET_KEY=notebooklm_lite_super_secret_production_key_2026_x98
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/notebooklm
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=notebooklm_documents
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-3.5-flash-lite
      - GEMINI_CHAT_MODEL=gemini-3.5-flash-lite
      - GEMINI_EMBEDDING_MODEL=gemini-embedding-001
      - CORS_ORIGINS=http://localhost:5173,http://localhost:80,http://127.0.0.1:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./notebooklm-lite
      dockerfile: Dockerfile
    container_name: notebooklm_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: notebooklm_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notebooklm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notebooklm"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: notebooklm_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  backend_uploads:
  postgres_data:
  qdrant_storage:
