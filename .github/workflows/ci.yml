name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Lint, Test & Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmupdf-dev build-essential

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov pip-audit

      - name: Run Ruff Linter
        run: |
          ruff check app tests || echo "Linter warnings detected (non-blocking)"

      - name: Run Dependency Security Audit
        run: |
          pip-audit --desc on || echo "Security audit warnings logged (non-blocking in dev)"

      - name: Run Pytest Suite with Coverage
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          ALLOW_DEMO_FALLBACK: "true"
          RATE_LIMIT_ENABLED: "false"
          SECURITY_HEADERS_ENABLED: "true"
          DATABASE_URL: sqlite+aiosqlite:///test_ci.db
        run: |
          pytest tests/ -v --maxfail=5

  frontend-test:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebooklm-lite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: notebooklm-lite/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        env:
          VITE_API_BASE_URL: ""
          VITE_APP_NAME: "NotebookLM Lite"
          VITE_APP_VERSION: "1.4"
        run: npm run build

  docker-scan:
    name: Docker Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: notebooklm-backend:ci-test
          load: true

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./notebooklm-lite
          file: ./notebooklm-lite/Dockerfile
          push: false
          tags: notebooklm-frontend:ci-test
          load: true

