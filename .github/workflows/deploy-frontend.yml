name: Deploy Frontend (S3 + CloudFront)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
  push:
    branches: [main]
    paths:
      - "notebooklm-lite/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write   # Required for AWS IAM OIDC Federation
  contents: read

env:
  AWS_REGION: ap-south-1
  S3_BUCKET: notebooklm-frontend-production
  CLOUDFRONT_DIST_ID: ${{ secrets.CLOUDFRONT_DIST_ID }}

jobs:
  deploy-frontend:
    name: Build & Deploy React SPA
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: notebooklm-lite

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: notebooklm-lite/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        env:
          VITE_API_BASE_URL: ""  # Empty string proxies /api to ALB via CloudFront behavior
          VITE_APP_NAME: "NotebookLM Lite"
          VITE_APP_VERSION: "1.4"
        run: npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          role-session-name: GitHubActions-NotebookLM-FrontendDeploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Static Assets to S3 (Long-term Cache)
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }}/ \
            --delete \
            --exclude "index.html" \
            --exclude "*.json" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML & Entrypoints to S3 (No-Cache)
        run: |
          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html"

      - name: Invalidate CloudFront CDN Cache
        if: env.CLOUDFRONT_DIST_ID != ''
        run: |
          echo "Triggering CloudFront cache invalidation for distribution ${{ env.CLOUDFRONT_DIST_ID }}..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DIST_ID }} \
            --paths "/*"

